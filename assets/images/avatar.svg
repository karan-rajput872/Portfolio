<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Priyanshu Karan Developer Avatar">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.2" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="120" cy="120" r="116" fill="url(#bgGrad)" />
  
  <!-- Outer Subtle Tech Ring -->
  <circle cx="120" cy="120" r="114" fill="none" stroke="url(#glowRing)" stroke-width="2.5" />
  <circle cx="120" cy="120" r="106" fill="none" stroke="rgba(249, 115, 22, 0.2)" stroke-dasharray="6 8" stroke-width="1.5" />

  <!-- Developer Silhouette / Tech Iconography -->
  <!-- Head & Shoulders Shape -->
  <g transform="translate(0, 10)">
    <!-- Shoulders -->
    <path d="M 52 195 C 52 155, 80 142, 120 142 C 160 142, 188 155, 188 195 Z" fill="#1c1c24" stroke="rgba(249, 115, 22, 0.3)" stroke-width="2" />
    <!-- Collar / Hoodie V -->
    <path d="M 104 145 L 120 166 L 136 145" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Neck -->
    <rect x="108" y="118" width="24" height="26" rx="4" fill="#262632" />
    
    <!-- Head -->
    <circle cx="120" cy="92" r="36" fill="#22222c" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
    
    <!-- Developer Hair / Sleek Cap Cut -->
    <path d="M 85 88 C 85 58, 100 50, 120 50 C 140 50, 155 58, 155 88 C 145 74, 134 76, 120 76 C 106 76, 95 74, 85 88 Z" fill="url(#accentGrad)" />

    <!-- Modern Minimal Glasses / HUD -->
    <rect x="94" y="86" width="22" height="13" rx="3" fill="none" stroke="#f8fafc" stroke-width="2" />
    <rect x="124" y="86" width="22" height="13" rx="3" fill="none" stroke="#f8fafc" stroke-width="2" />
    <line x1="116" y1="92" x2="124" y2="92" stroke="#f8fafc" stroke-width="2" />
  </g>

  <!-- Code Symbols floating softly in background -->
  <text x="36" y="80" fill="rgba(249, 115, 22, 0.45)" font-family="monospace" font-size="16" font-weight="bold">&lt;/&gt;</text>
  <text x="180" y="80" fill="rgba(249, 115, 22, 0.45)" font-family="monospace" font-size="16" font-weight="bold">{;}</text>

  <!-- Small Active Dot Badge at Bottom Right of Avatar -->
  <circle cx="182" cy="182" r="14" fill="#09090b" />
  <circle cx="182" cy="182" r="10" fill="#22c55e" filter="url(#subtleGlow)" />
  <circle cx="182" cy="182" r="6" fill="#86efac" />
</svg>
